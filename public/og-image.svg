<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1F3D"/>
      <stop offset="50%" stop-color="#4A1525"/>
      <stop offset="100%" stop-color="#8B263E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F2A93B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative Stars / Sparkles -->
  <circle cx="150" cy="120" r="3" fill="#FDE68A" opacity="0.6"/>
  <circle cx="280" cy="80" r="4" fill="#FDE68A" opacity="0.8"/>
  <circle cx="1050" cy="140" r="3.5" fill="#FDE68A" opacity="0.7"/>
  <circle cx="950" cy="90" r="5" fill="#FDE68A" opacity="0.9"/>
  <circle cx="1100" cy="520" r="4" fill="#FDE68A" opacity="0.6"/>
  <circle cx="120" cy="480" r="3" fill="#FDE68A" opacity="0.7"/>

  <!-- Book Icon Badge -->
  <g transform="translate(600, 190)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="70" fill="#FFFDF7"/>
    <text x="0" y="28" font-size="70" text-anchor="middle">📖</text>
  </g>

  <!-- Title & Branding -->
  <text x="600" y="320" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#FFFDF7" text-anchor="middle" letter-spacing="-1">
    AI Storybook Generator
  </text>
  
  <text x="600" y="375" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="28" fill="url(#goldGrad)" text-anchor="middle">
    Magical Personalized Picture Books Starring Your Child
  </text>

  <!-- Subtitle / Features -->
  <text x="600" y="440" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="20" fill="#F6EBD3" text-anchor="middle" opacity="0.9">
    ✨ Illustrated Avatars • 📖 3D Page-Turn Reader • 🔊 Read-Aloud Audio • 📄 Print-Ready PDF
  </text>

  <!-- Domain Badge -->
  <g transform="translate(600, 520)">
    <rect x="-180" y="-22" width="360" height="44" rx="22" fill="#FFFDF7" opacity="0.15" stroke="#FDE68A" stroke-width="1.5"/>
    <text x="0" y="6" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#FFFDF7" text-anchor="middle" letter-spacing="1">
      childrenstorybooksgenerator.vercel.app
    </text>
  </g>
</svg>
